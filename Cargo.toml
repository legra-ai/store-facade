[workspace]
resolver = "3"
members = ["crates/store-facade-model"]

[workspace.package]
version = "0.0.0"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/store-facade"

[workspace.dependencies]
blake3 = "1.8.7"
futures-core = "0.3.34"
iri-rfc3987 = "=0.3.4"
rdf-structural-model = "=0.6.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio-util = { version = "0.7.20", default-features = false }

futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
proptest = "1.12.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

rhusky = "2.0.12"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
